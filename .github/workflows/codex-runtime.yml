name: Codex Jev runtime

on:
  push:
    branches: [codex-compaction, main]
    paths:
      - 'runtime/**'
      - '.github/workflows/codex-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
      RUST_MIN_STACK: '8388608'
    steps:
      - uses: actions/checkout@v4
      - name: Check plugin
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts && npm test && npm run typecheck && npm run build && python3 -m unittest discover -s tests -p 'test_install_codex.py'
      - name: Fetch exact Codex source
        run: |
          git clone --depth 1 --branch rust-v0.159.0 https://github.com/openai/codex.git codex-source
          test "$(git -C codex-source rev-parse HEAD)" = "687a119f0fcaace47e1f1abcc77cec6c813fd6da"
          git -C codex-source apply --check ../runtime/codex-0.159.0.patch
          git -C codex-source apply ../runtime/codex-0.159.0.patch
      - name: Prepare build tools
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          brew install just cargo-nextest uv dotslash
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-source/codex-rs/target
          key: jev-codex-159-macos-195-${{ hashFiles('runtime/codex-0.159.0.patch') }}
          restore-keys: jev-codex-159-macos-195-
      - name: Format native patch
        working-directory: codex-source
        run: just fmt
      - name: Check native compaction behavior
        working-directory: codex-source
        run: FAST_JEV_COMPACTION_ADAPTER="$PWD/codex-rs/core/tests/fixtures/jev_compaction_adapter.py" just test -p codex-core --test jev_compaction --cargo-profile release
      - name: Build custom runtime
        working-directory: codex-source/codex-rs
        env:
          STABLE_GIT_COMMIT: ${{ github.sha }}
        run: |
          test "$(uname -m)" = "arm64"
          cargo build --locked --release -p codex-cli --bin codex
      - name: Preserve compiled dependencies
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-source/codex-rs/target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Package runtime and exact applied patch
        run: |
          mkdir -p codex-runtime/bin
          cp codex-source/codex-rs/target/release/codex codex-runtime/bin/codex
          cp codex-source/LICENSE codex-runtime/LICENSE
          cp codex-source/NOTICE codex-runtime/NOTICE
          printf '%s\n' '{"layoutVersion":1,"version":"0.159.0-jev.0","target":"aarch64-apple-darwin","variant":"codex","entrypoint":"bin/codex","resourcesDir":"codex-resources","pathDir":"codex-path"}' > codex-runtime/codex-package.json
          codesign --force --sign - codex-runtime/bin/codex
          codex-runtime/bin/codex --version
          git -C codex-source add -N .
          git -C codex-source diff > codex-runtime/applied.patch
          shasum -a 256 codex-runtime/bin/codex > codex-runtime/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: codex-0.159.0-jev-macos-arm64
          path: codex-runtime/
          retention-days: 30
